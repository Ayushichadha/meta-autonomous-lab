[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-recovery-lab"
version = "0.1.0"
description = "Simulation-backed factory recovery with measurable scheduling decisions"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.12,<10",
  "simpy>=4.1,<5",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
factory-lab = "factory_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory_lab = ["scenarios/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
